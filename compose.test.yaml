services:
  postgres-test:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: scdc_chat_test
      POSTGRES_USER: scdc_test
      POSTGRES_PASSWORD: scdc_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scdc_test -d scdc_chat_test"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - scdc-postgres-test-data:/var/lib/postgresql
      - ./database/postgres/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./database/postgres/seed.sql:/docker-entrypoint-initdb.d/002-seed.sql:ro

volumes:
  scdc-postgres-test-data:
