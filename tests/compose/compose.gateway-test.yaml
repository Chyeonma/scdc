name: scdc-gateway-test
x-jwt-trust:
  Authentication__Jwt__Issuer: SCDC
  Authentication__Jwt__Audience: SCDC.WebClient
  Authentication__Jwt__PublicKeyDirectory: /app/auth-public
  Authentication__Jwt__KeyIds__0: identity-local-v1
services:
  auth-redis:
    image: docker.io/library/redis:8.2.11-alpine
    command:
    - redis-server
    - --maxmemory
    - 128mb
    - --maxmemory-policy
    - noeviction
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 2s
      timeout: 2s
      retries: 30
  identity-keygen:
    build:
      context: ../..
      dockerfile: services/Identity/SCDC.Identity.Api/Dockerfile
    entrypoint:
    - dotnet
    - SCDC.Identity.Api.dll
    - --initialize-jwt-keys
    environment:
      Authentication__Jwt__Issuer: SCDC
      Authentication__Jwt__Audience: SCDC.WebClient
      Authentication__Jwt__PublicKeyDirectory: /app/auth-public
      Authentication__Jwt__KeyIds__0: identity-local-v1
      Modules__Identity__PrivateKeyPath: /app/auth-private/identity-local-v1.pem
    volumes:
    - gateway-private-keys:/app/auth-private
    - gateway-public-keys:/app/auth-public
  postgres:
    image: docker.io/library/postgres:18-alpine
    environment:
      POSTGRES_DB: scdc_gateway_test
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:-scdc_identity_dev}
      COMMUNITY_DB_PASSWORD: ${COMMUNITY_DB_PASSWORD:-scdc_community_dev}
      MESSAGING_DB_PASSWORD: ${MESSAGING_DB_PASSWORD:-scdc_messaging_dev}
      POSTGRES_USER: scdc_gateway_test
      POSTGRES_PASSWORD: gateway-test-only
      COMMUNITY_DATABASE_NAME: scdc_community_gateway_test
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -h 127.0.0.1 -U scdc_gateway_test -d scdc_gateway_test
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
    - gateway-postgres-data:/var/lib/postgresql
    - ../../database/postgres/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro,z
    - ../../database/postgres/init-module-roles.sh:/docker-entrypoint-initdb.d/003-module-roles.sh:ro,z
    - ../../database/postgres/module-roles.sql:/opt/scdc/module-roles.sql:ro,z
    - ../../database/postgres/init-identity-source-freeze.sh:/docker-entrypoint-initdb.d/004-freeze-identity.sh:ro,z
    - ../../database/postgres/community:/opt/scdc/community:ro,z
    - ../../database/postgres/community/init-source.sh:/docker-entrypoint-initdb.d/005-community-database.sh:ro,z
    secrets:
    - community_database_password
  chat-service:
    build:
      context: ../..
      dockerfile: services/SCDC.Api/Dockerfile
    environment:
      Authentication__Jwt__Issuer: SCDC
      Authentication__Jwt__Audience: SCDC.WebClient
      Authentication__Jwt__PublicKeyDirectory: /app/auth-public
      Authentication__Jwt__KeyIds__0: identity-local-v1
      ASPNETCORE_ENVIRONMENT: Development
      Authentication__Sessions__Endpoint: auth-redis:6379
      ConnectionStrings__Messaging: Host=postgres;Port=5432;Database=scdc_gateway_test;Username=scdc_messaging;Password=${MESSAGING_DB_PASSWORD:-scdc_messaging_dev}
      Modules__Messaging__FingerprintKeyDirectory: /app/messaging-keys
      Modules__Messaging__ActiveFingerprintKeyId: dm-local-v1
      InternalRpc__CaPath: /run/secrets/rpc_ca
      InternalRpc__CertificatePath: /run/secrets/rpc_monolith_certificate
      InternalRpc__PrivateKeyPath: /run/secrets/rpc_monolith_private_key
      InternalRpc__AllowedPeers__0: identity-service
      InternalRpc__Identity__Endpoint: https://identity-service:8443
      Modules__Messaging__CursorKeyRingPath: /app/messaging-cursor-keys
      Modules__Messaging__CursorApplicationName: SCDC.GatewayTest
      Hosting__CommunityEnabled: 'false'
      InternalRpc__AllowedPeers__1: community-service
    depends_on:
      identity-keygen:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      auth-redis:
        condition: service_healthy
      identity-service:
        condition: service_started
      messaging-cursor-keygen:
        condition: service_completed_successfully
      community-cutover-gate:
        condition: service_completed_successfully
    volumes:
    - gateway-messaging-keys:/app/messaging-keys
    - gateway-public-keys:/app/auth-public:ro
    - gateway-messaging-cursor-keys:/app/messaging-cursor-keys
    secrets:
    - rpc_ca
    - rpc_monolith_certificate
    - rpc_monolith_private_key
  sample-service:
    build:
      context: ../..
      dockerfile: services/Sample/SCDC.Sample.Api/Dockerfile
    environment:
      Authentication__Jwt__Issuer: SCDC
      Authentication__Jwt__Audience: SCDC.WebClient
      Authentication__Jwt__PublicKeyDirectory: /app/auth-public
      Authentication__Jwt__KeyIds__0: identity-local-v1
    volumes:
    - gateway-public-keys:/app/auth-public:ro
    depends_on:
      identity-keygen:
        condition: service_completed_successfully
  web-client:
    build:
      context: ../../clients/WebClient
      dockerfile: Dockerfile
    ports:
    - 127.0.0.1:${GATEWAY_WEB_PORT:-15310}:80
    depends_on:
      chat-service:
        condition: service_started
      sample-service:
        condition: service_started
      identity-service:
        condition: service_started
      community-service:
        condition: service_started
    environment:
      SCDC_SAMPLE_ENABLED: 'true'
      SCDC_HEALTH_UPSTREAM: sample-service:8080/health
      SCDC_COMMUNITY_UPSTREAM: community-service:8080
  identity-service:
    build:
      context: ../..
      dockerfile: services/Identity/SCDC.Identity.Api/Dockerfile
    environment:
      Authentication__Jwt__Issuer: SCDC
      Authentication__Jwt__Audience: SCDC.WebClient
      Authentication__Jwt__PublicKeyDirectory: /app/auth-public
      Authentication__Jwt__KeyIds__0: identity-local-v1
      ASPNETCORE_ENVIRONMENT: Development
      Authentication__Sessions__Endpoint: auth-redis:6379
      ConnectionStrings__Identity: Host=identity-postgres;Port=5432;Database=scdc_identity_gateway_test;Username=scdc_identity
      Modules__Identity__PrivateKeyPath: /app/auth-private/identity-local-v1.pem
      Modules__Identity__ExposeDevelopmentTokens: 'true'
      Modules__Identity__UserSearch__ApplicationName: SCDC.GatewayTest
      InternalRpc__CaPath: /run/secrets/rpc_ca
      InternalRpc__CertificatePath: /run/secrets/rpc_identity_certificate
      InternalRpc__PrivateKeyPath: /run/secrets/rpc_identity_private_key
      InternalRpc__AllowedPeers__0: chat-service
      InternalRpc__Community__Endpoint: https://community-service:8443
      InternalRpc__Messaging__Endpoint: https://chat-service:8443
      InternalRpc__PeerOwners__chat-service__0: Messaging
      ConnectionStrings__IdentityPasswordFile: /run/secrets/identity_database_password
      InternalRpc__AllowedPeers__1: community-service
      InternalRpc__Community__Peer: community-service
      InternalRpc__PeerOwners__community-service__0: Community
      InternalRpc__PermitDelegations__community-service__Messaging__0: ChannelRead
    depends_on:
      identity-keygen:
        condition: service_completed_successfully
      auth-redis:
        condition: service_healthy
      identity-postgres:
        condition: service_healthy
      identity-cutover-gate:
        condition: service_completed_successfully
      community-cutover-gate:
        condition: service_completed_successfully
    secrets:
    - rpc_ca
    - rpc_identity_certificate
    - rpc_identity_private_key
    - identity_database_password
    volumes:
    - gateway-identity-keys:/app/.dm-keys/user-search
    - gateway-private-keys:/app/auth-private:ro
    - gateway-public-keys:/app/auth-public:ro
  messaging-cursor-keygen:
    build:
      context: ../..
      dockerfile: services/SCDC.Api/Dockerfile
    entrypoint:
    - /bin/sh
    - -ec
    - umask 077; if ! find /app/messaging-cursor-keys -name 'key-*.xml' | grep -q .; then cp -a /app/legacy-cursors/. /app/messaging-cursor-keys/;
      fi
    volumes:
    - gateway-identity-keys:/app/legacy-cursors:ro
    - gateway-messaging-cursor-keys:/app/messaging-cursor-keys
  identity-postgres:
    image: docker.io/library/postgres:18-alpine
    environment:
      POSTGRES_DB: scdc_identity_gateway_test
      POSTGRES_USER: scdc_identity_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/identity_database_admin_password
    secrets:
    - identity_database_admin_password
    - identity_database_password
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -h 127.0.0.1 -U scdc_identity_admin -d scdc_identity_gateway_test
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
    - gateway-identity-postgres-data:/var/lib/postgresql
    - ../../database/postgres/identity/init.sh:/docker-entrypoint-initdb.d/001-identity.sh:ro,z
    - ../../database/postgres/identity:/opt/scdc/identity:ro,z
  identity-cutover-gate:
    image: docker.io/library/postgres:18-alpine
    entrypoint:
    - /bin/sh
    - /opt/scdc/cutover-gate.sh
    environment:
      SOURCE_DATABASE_USER: scdc_gateway_test
      SOURCE_DATABASE_NAME: scdc_gateway_test
      SOURCE_DATABASE_PASSWORD: gateway-test-only
      TARGET_DATABASE_NAME: scdc_identity_gateway_test
    secrets:
    - identity_database_admin_password
    volumes:
    - ../../database/postgres/identity/cutover-gate.sh:/opt/scdc/cutover-gate.sh:ro,z
    depends_on:
      postgres:
        condition: service_healthy
      identity-postgres:
        condition: service_healthy
  community-database-init:
    image: docker.io/library/postgres:18-alpine
    entrypoint:
    - /bin/sh
    - /opt/scdc/community/bootstrap-target.sh
    environment:
      PGHOST: postgres
      PGUSER: scdc_gateway_test
      PGPASSWORD: gateway-test-only
      PGDATABASE: scdc_gateway_test
      COMMUNITY_DATABASE_NAME: scdc_community_gateway_test
    secrets:
    - community_database_password
    volumes:
    - ../../database/postgres/community:/opt/scdc/community:ro,z
    depends_on:
      postgres:
        condition: service_healthy
  community-cutover-gate:
    image: docker.io/library/postgres:18-alpine
    entrypoint:
    - /bin/sh
    - /opt/scdc/community/cutover-gate.sh
    environment:
      PGHOST: postgres
      PGUSER: scdc_gateway_test
      PGPASSWORD: gateway-test-only
      PGDATABASE: scdc_gateway_test
      COMMUNITY_DATABASE_NAME: scdc_community_gateway_test
    volumes:
    - ../../database/postgres/community:/opt/scdc/community:ro,z
    depends_on:
      community-database-init:
        condition: service_completed_successfully
  community-service:
    build:
      context: ../..
      dockerfile: services/Community/SCDC.Community.Api/Dockerfile
    environment:
      Authentication__Jwt__Issuer: SCDC
      Authentication__Jwt__Audience: SCDC.WebClient
      Authentication__Jwt__PublicKeyDirectory: /app/auth-public
      Authentication__Jwt__KeyIds__0: identity-local-v1
      Authentication__Sessions__Endpoint: auth-redis:6379
      ASPNETCORE_ENVIRONMENT: Development
      CommunityHost__Integrated: 'true'
      ConnectionStrings__Community: Host=postgres;Port=5432;Database=scdc_community_gateway_test;Username=scdc_community_service
      ConnectionStrings__CommunityPasswordFile: /run/secrets/community_database_password
      Modules__Community__Operations__ActiveKeyId: gateway-test
      Modules__Community__KeyRingPath: /app/community-keys
      InternalRpc__CaPath: /run/secrets/rpc_ca
      InternalRpc__CertificatePath: /run/secrets/rpc_community_certificate
      InternalRpc__PrivateKeyPath: /run/secrets/rpc_community_private_key
      InternalRpc__AllowedPeers__0: identity-service
      InternalRpc__AllowedPeers__1: chat-service
      InternalRpc__Identity__Endpoint: https://identity-service:8443
      InternalRpc__Messaging__Endpoint: https://chat-service:8443
      Modules__Community__Operations__Keys__gateway-test: Z2F0ZXdheS10ZXN0LW9ubHkta2V5LWF0LWxlYXN0LTMyLWJ5dGVz
    secrets:
    - community_database_password
    - rpc_ca
    - rpc_community_certificate
    - rpc_community_private_key
    volumes:
    - gateway-community-keys:/app/community-keys
    - gateway-public-keys:/app/auth-public:ro
    depends_on:
      community-cutover-gate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      auth-redis:
        condition: service_healthy
      identity-keygen:
        condition: service_completed_successfully
      identity-service:
        condition: service_started
      chat-service:
        condition: service_started
    restart: unless-stopped
volumes:
  gateway-postgres-data: null
  gateway-identity-keys: null
  gateway-community-keys: null
  gateway-messaging-keys: null
  gateway-private-keys: null
  gateway-public-keys: null
  gateway-messaging-cursor-keys: null
  gateway-identity-postgres-data: null
secrets:
  rpc_ca:
    file: ${SCDC_RPC_SECRET_DIR:-${HOME}/.local/share/scdc/rpc-secrets}/ca.crt
  rpc_identity_certificate:
    file: ${SCDC_RPC_SECRET_DIR:-${HOME}/.local/share/scdc/rpc-secrets}/identity-service.crt
  rpc_identity_private_key:
    file: ${SCDC_RPC_SECRET_DIR:-${HOME}/.local/share/scdc/rpc-secrets}/identity-service.key
  rpc_monolith_certificate:
    file: ${SCDC_RPC_SECRET_DIR:-${HOME}/.local/share/scdc/rpc-secrets}/chat-service.crt
  rpc_monolith_private_key:
    file: ${SCDC_RPC_SECRET_DIR:-${HOME}/.local/share/scdc/rpc-secrets}/chat-service.key
  identity_database_admin_password:
    file: ${SCDC_IDENTITY_DB_SECRET_DIR:-${HOME}/.local/share/scdc/identity-database-secrets}/identity_database_admin_password
  identity_database_password:
    file: ${SCDC_IDENTITY_DB_SECRET_DIR:-${HOME}/.local/share/scdc/identity-database-secrets}/identity_database_password
  rpc_community_certificate:
    file: ${SCDC_RPC_SECRET_DIR:-${HOME}/.local/share/scdc/rpc-secrets}/community-service.crt
  rpc_community_private_key:
    file: ${SCDC_RPC_SECRET_DIR:-${HOME}/.local/share/scdc/rpc-secrets}/community-service.key
  community_database_password:
    file: ${SCDC_COMMUNITY_DB_SECRET_DIR:-${HOME}/.local/share/scdc/community-database-secrets}/community_database_password
