services:
  chat-service:
    build:
      context: .
      dockerfile: services/SCDC.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=scdc_chat;Username=scdc;Password=scdc_dev
      Modules__Identity__SigningKey: scdc-development-signing-key-change-before-production-2026
      Modules__Identity__ExposeDevelopmentTokens: ${SCDC_EXPOSE_DEVELOPMENT_TOKENS:-false}
      Modules__Identity__Email__Enabled: ${SCDC_EMAIL_ENABLED:-false}
      Modules__Identity__Email__PublicOrigin: ${SCDC_PUBLIC_ORIGIN:-http://localhost:3000}
      Modules__Identity__Email__SenderAddress: ${SCDC_GMAIL_ADDRESS:-}
      Modules__Identity__Email__AppPassword: ${SCDC_GMAIL_APP_PASSWORD:-}
      Modules__Identity__Email__KeyRingPath: /var/lib/scdc/identity-keys
    ports:
      - "5026:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - scdc-identity-keys:/var/lib/scdc/identity-keys

  web-client:
    build:
      context: ./clients/WebClient
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      chat-service:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: docker.io/library/postgres:18-alpine
    environment:
      POSTGRES_DB: scdc_chat
      POSTGRES_USER: scdc
      POSTGRES_PASSWORD: scdc_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scdc -d scdc_chat"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - scdc-postgres-data:/var/lib/postgresql
      - ./database/postgres/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./database/postgres/seed.sql:/docker-entrypoint-initdb.d/002-seed.sql:ro
      - ./database/postgres/migrations:/docker-entrypoint-initdb.d/migrations:ro

volumes:
  scdc-postgres-data:
  scdc-identity-keys:
