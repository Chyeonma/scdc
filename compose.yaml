services:
  chat-service:
    build:
      context: .
      dockerfile: services/SCDC.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=scdc_chat;Username=scdc;Password=scdc_dev
      Modules__Identity__SigningKey: scdc-development-signing-key-change-before-production-2026
      Modules__Community__Operations__ActiveKeyId: local1
      Modules__Community__Operations__Keys__local1: ${COMMUNITY_OPERATION_KEY:?Set COMMUNITY_OPERATION_KEY to a persistent base64 key of at least 32 random bytes}
      Modules__Community__KeyRingPath: /app/community-keys
    volumes:
      - scdc-community-keys:/app/community-keys
    ports:
      - "5026:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web-client:
    build:
      context: ./clients/WebClient
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      chat-service:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: docker.io/library/postgres:18-alpine
    environment:
      POSTGRES_DB: scdc_chat
      POSTGRES_USER: scdc
      POSTGRES_PASSWORD: scdc_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scdc -d scdc_chat"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - scdc-postgres-data:/var/lib/postgresql
      - ./database/postgres/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./database/postgres/seed.sql:/docker-entrypoint-initdb.d/002-seed.sql:ro

volumes:
  scdc-postgres-data:
  scdc-community-keys:
