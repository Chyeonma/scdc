services:
  chat-service:
    environment:
      Observability__OtlpEndpoint: http://otel-collector:4317
      OTEL_SERVICE_NAME: scdc-chat
    depends_on:
      otel-collector:
        condition: service_started

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.136.0
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "127.0.0.1:4317:4317"
    volumes:
      - ./ops/observability/collector.yaml:/etc/otelcol/config.yaml:ro
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.6.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./ops/observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ./ops/observability/alerts.yaml:/etc/prometheus/alerts.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on: [otel-collector]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: local-observability-only
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./ops/observability/grafana:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3001:3000"
    depends_on: [prometheus]
    restart: unless-stopped
