# Isolated acceptance stack. Init only: schema.sql runs on a fresh volume.
# Never combine this file with compose.yaml; seed.sql is intentionally absent.
name: scdc-dm-acceptance
services:
  postgres:
    image: docker.io/library/postgres:18-alpine
    environment:
      POSTGRES_DB: scdc_dm_acceptance_test
      POSTGRES_USER: scdc_dm_test
      POSTGRES_PASSWORD: ${DM_POSTGRES_PASSWORD:?Run dm-acceptance.ps1 -Action Init first}
    ports:
      - "127.0.0.1:${DM_POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scdc_dm_test -d scdc_dm_acceptance_test"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - dm-postgres-data:/var/lib/postgresql
      - ./database/postgres/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

  chat-service:
    build:
      context: .
      dockerfile: services/SCDC.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=scdc_dm_acceptance_test;Username=scdc_dm_test;Password=${DM_POSTGRES_PASSWORD}
      Modules__Identity__SigningKey: ${DM_IDENTITY_SIGNING_KEY:?Run Init first}
      Modules__Identity__ExposeDevelopmentTokens: "true"
      Cors__AllowedOrigins__0: http://localhost:${DM_WEB_PORT:-15300}
      Modules__Identity__UserSearch__CursorKeyRingPath: /app/dm-keys/cursor
      Modules__Identity__UserSearch__ApplicationName: SCDC.UserSearch.dm-acceptance
      # Fingerprints are active for the P2 text writer.
      Modules__Messaging__CursorKeyRingPath: /app/dm-keys/cursor
      Modules__Messaging__FingerprintKeyDirectory: /app/dm-keys/hmac
      Modules__Messaging__ActiveFingerprintKeyId: dm-local-v1
    ports:
      - "127.0.0.1:${DM_API_PORT:-15026}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./.dm-acceptance/keyrings/cursor:/app/dm-keys/cursor
      - ./.dm-acceptance/keyrings/hmac:/app/dm-keys/hmac:ro

  web-client:
    build:
      context: ./clients/WebClient
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${DM_WEB_PORT:-15300}:80"
    depends_on:
      chat-service:
        condition: service_started

  backend-tests:
    profiles: ["tools"]
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /workspace
    environment:
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=scdc_dm_acceptance_test;Username=scdc_dm_test;Password=${DM_POSTGRES_PASSWORD}
      Modules__Identity__SigningKey: ${DM_IDENTITY_SIGNING_KEY}
      Modules__Identity__ExposeDevelopmentTokens: "true"
      Modules__Identity__UserSearch__CursorKeyRingPath: /artifacts/user-search-keys
      Modules__Identity__UserSearch__ApplicationName: SCDC.UserSearch.dm-integration-tests
      Modules__Messaging__FingerprintKeyDirectory: /test-hmac
      Modules__Messaging__ActiveFingerprintKeyId: dm-local-v1
    volumes:
      - .:/workspace:ro
      - ./.dm-acceptance/keyrings/hmac:/test-hmac:ro
      - ./.dm-acceptance/backend-artifacts:/artifacts
      - dm-test-nuget:/root/.nuget/packages
    depends_on:
      postgres:
        condition: service_healthy
    command: ["dotnet", "test", "SCDC.slnx", "--configuration", "Release", "--artifacts-path", "/artifacts", "--results-directory", "/artifacts/test-results", "--logger", "trx;LogFileName=dm-acceptance.trx"]

volumes:
  dm-postgres-data:
  dm-test-nuget:
