name: Documentation links

# CI checks links for every PR and main push. Keep this workflow for manual use.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: python3 scripts/check_docs.py
