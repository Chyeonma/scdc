name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
      ConnectionStrings__TestDatabase: Host=127.0.0.1;Port=5432;Database=scdc_ci_test;Username=scdc_ci;Password=ci-postgres-only
      ConnectionStrings__Identity: Host=127.0.0.1;Port=5432;Database=scdc_ci_test;Username=scdc_identity;Password=scdc_identity_dev;Pooling=false
      ConnectionStrings__Community: Host=127.0.0.1;Port=5432;Database=scdc_ci_test;Username=scdc_community;Password=scdc_community_dev
      ConnectionStrings__Messaging: Host=127.0.0.1;Port=5432;Database=scdc_ci_test;Username=scdc_messaging;Password=scdc_messaging_dev;Maximum Pool Size=50
      Modules__Identity__ExposeDevelopmentTokens: "true"
      Modules__Identity__UserSearch__ApplicationName: SCDC.CI
      Modules__Messaging__ActiveFingerprintKeyId: dm-local-v1
      # Integration tests explicitly dispatch events; avoid a competing worker.
      Modules__Messaging__Dispatcher__Enabled: "false"
      Authentication__Sessions__Endpoint: 127.0.0.1:6379
    services:
      redis:
        image: docker.io/library/redis:8.2.11-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 2s
          --health-retries 20
      postgres:
        image: docker.io/library/postgres:18-alpine
        env:
          POSTGRES_DB: scdc_ci_test
          POSTGRES_USER: scdc_ci
          POSTGRES_PASSWORD: ci-postgres-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U scdc_ci -d scdc_ci_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Prepare test keys
        run: |
          umask 077
          fingerprint_dir="$RUNNER_TEMP/scdc-ci/messaging-keys"
          cursor_dir="$RUNNER_TEMP/scdc-ci/user-search"
          mkdir -p "$fingerprint_dir" "$cursor_dir"
          head -c 32 /dev/urandom > "$fingerprint_dir/dm-local-v1.key"
          printf 'Modules__Messaging__FingerprintKeyDirectory=%s\n' "$fingerprint_dir" >> "$GITHUB_ENV"
          printf 'Modules__Identity__UserSearch__CursorKeyRingPath=%s\n' "$cursor_dir" >> "$GITHUB_ENV"
      - name: Initialize test database
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec -i "$POSTGRES_CONTAINER" psql -X -h 127.0.0.1 -U scdc_ci -d scdc_ci_test -v ON_ERROR_STOP=1 < database/postgres/schema.sql
          docker cp database/postgres/module-roles.sql "$POSTGRES_CONTAINER:/tmp/module-roles.sql"
          docker exec -e IDENTITY_DB_PASSWORD=scdc_identity_dev -e COMMUNITY_DB_PASSWORD=scdc_community_dev -e MESSAGING_DB_PASSWORD=scdc_messaging_dev "$POSTGRES_CONTAINER" psql -X -U scdc_ci -d scdc_ci_test -f /tmp/module-roles.sql
      - name: Restore backend
        run: dotnet restore SCDC.slnx
      - name: Test local secret provisioning
        run: python3 -m unittest discover -s scripts/tests
      - name: Build backend
        run: dotnet build SCDC.slnx --configuration Release --no-restore
      - name: Test backend
        run: dotnet test SCDC.slnx --configuration Release --no-build --logger "trx;LogFileName=backend.trx" --results-directory artifacts/ci/backend
      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-test-results
          path: artifacts/ci/backend/*.trx
          if-no-files-found: warn
          retention-days: 7

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: clients/WebClient/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix clients/WebClient ci
      - name: Test frontend
        run: npm --prefix clients/WebClient test
      - name: Build frontend
        run: npm --prefix clients/WebClient run build
      - name: Upload WebClient build
        uses: actions/upload-artifact@v6
        with:
          name: web-client-build
          path: clients/WebClient/dist/
          if-no-files-found: error
          retention-days: 7

  identity-transfer:
    name: Identity database transfer
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"
    services:
      source:
        image: docker.io/library/postgres:18-alpine
        env:
          POSTGRES_DB: scdc_transfer_source_test
          POSTGRES_USER: transfer_source
          POSTGRES_PASSWORD: ci-transfer-source-only
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U transfer_source -d scdc_transfer_source_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
      target:
        image: docker.io/library/postgres:18-alpine
        env:
          POSTGRES_DB: scdc_transfer_target_test
          POSTGRES_USER: transfer_target
          POSTGRES_PASSWORD: ci-transfer-target-only
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U transfer_target -d scdc_transfer_target_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Build database tool
        run: dotnet build tools/SCDC.DbMigrator -c Release
      - name: Exercise offline transfer and recovery
        env:
          SOURCE_CONTAINER: ${{ job.services.source.id }}
          TARGET_CONTAINER: ${{ job.services.target.id }}
        run: >-
          python3 scripts/test_identity_transfer.py --engine docker
          --source-container "$SOURCE_CONTAINER" --source-port 5433
          --target-container "$TARGET_CONTAINER" --target-port 5434
      - name: Upload transfer summary
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: identity-transfer-summary
          path: artifacts/identity-transfer/*/result.json
          if-no-files-found: warn
          retention-days: 7

  ci:
    name: CI
    if: always()
    needs: [backend, frontend, identity-transfer]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful backend and frontend
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          TRANSFER_RESULT: ${{ needs.identity-transfer.result }}
        run: |
          printf 'Backend: %s\nFrontend: %s\n' "$BACKEND_RESULT" "$FRONTEND_RESULT"
          test "$BACKEND_RESULT" = success
          test "$FRONTEND_RESULT" = success
          test "$TRANSFER_RESULT" = success
