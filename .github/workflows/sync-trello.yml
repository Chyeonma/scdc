name: Sync Markdown to Trello

on:
  push:
    branches:
      - main  # Hoặc master tùy theo nhánh chính của bạn
    paths:
      - 'docs/**'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Push content to Trello - Customer Request
        env:
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          CARD_ID: ${{ secrets.TRELLO_CARD_ID_TONGQUAN }}
        run: |
          FILE_PATH="docs/project.md"

          if [ -f "$FILE_PATH" ]; then
            # Dùng jq đọc nội dung file md và encode thành chuỗi JSON hợp lệ
            jq -n --rawfile content "$FILE_PATH" '{desc: $content}' > payload.json

            # Gửi request PUT dưới dạng application/json
            curl --fail --show-error --request PUT \
              --url "https://api.trello.com/1/cards/${CARD_ID}?key=${TRELLO_KEY}&token=${TRELLO_TOKEN}" \
              --header "Content-Type: application/json; charset=utf-8" \
              --data @payload.json
          fi
