name: Sync tasks to Trello

# Đồng bộ một chiều nội dung thẻ từ docs/project/tasks/*.md lên Trello.
# Cách dùng và cài đặt: docs/project/tasks/README.md

on:
  push:
    branches:
      - main
    paths:
      - 'docs/project/tasks/**'
      - 'scripts/sync_trello.py'
      - '.github/workflows/sync-trello.yml'
  workflow_dispatch:

concurrency:
  group: sync-trello
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync cards
        env:
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          TRELLO_BOARD_ID: ${{ vars.TRELLO_BOARD_ID }}
          TRELLO_LIST_ID: ${{ vars.TRELLO_LIST_ID }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: python3 scripts/sync_trello.py
