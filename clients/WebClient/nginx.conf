map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Filled by the official image's local-resolver/envsubst entrypoint scripts.
# A variable proxy_pass resolves the service again after a container IP changes.
resolver ${NGINX_LOCAL_RESOLVERS} valid=5s ipv6=off;
resolver_timeout 2s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    set $api_upstream chat-service:8080;
    set $sample_upstream sample-service:8080;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_connect_timeout 5s;
    # Let the application reconcile mutations using its operation IDs.
    proxy_next_upstream off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'healthy';
    }

    location = /health {
        proxy_pass http://$sample_upstream;
    }

    location = /api {
        proxy_pass http://$api_upstream;
    }

    location ^~ /api/ {
        proxy_pass http://$api_upstream;
    }

    location = /hubs {
        access_log off;
        error_log /dev/stderr crit;
        proxy_pass http://$api_upstream;
    }

    location ^~ /hubs/ {
        # WebSocket URLs can contain access_token. Do not put them in the access log.
        access_log off;
        # Upstream connection errors also include the request URL at error level.
        error_log /dev/stderr crit;
        proxy_pass http://$api_upstream;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /swagger {
        proxy_pass http://$api_upstream;
    }

    location ^~ /swagger/ {
        proxy_pass http://$api_upstream;
    }

    # The HTML entry point must fetch the current hashed assets after deployment.
    location = /index.html {
        add_header Cache-Control "no-store" always;
        # Location-level add_header directives replace the inherited headers.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        etag off;
        if_modified_since off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
