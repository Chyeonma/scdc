# Local development overrides; merged with compose.yaml by Make and ops scripts.
services:
  identity-service:
    build:
      context: .
      dockerfile: services/Identity/SCDC.Identity.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Modules__Identity__ExposeDevelopmentTokens: 'true'
    ports:
    - 127.0.0.1:5027:8080
  community-service:
    build:
      context: .
      dockerfile: services/Community/SCDC.Community.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    ports:
    - 127.0.0.1:5028:8080
  chat-service:
    build:
      context: .
      dockerfile: services/SCDC.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    ports:
    - 5026:8080
  web-client:
    build:
      context: ./clients/WebClient
      dockerfile: Dockerfile
  postgres:
    ports:
    - 5432:5432
  identity-postgres:
    ports:
    - 127.0.0.1:5433:5432
